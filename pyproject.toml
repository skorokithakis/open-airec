[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airec-client"
version = "0.0.1"
description = "Evidence-driven, experimental AIREC recorder client"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["bleak>=0.22,<0.23"]

[project.scripts]
airec-client = "airec_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
