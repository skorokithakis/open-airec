[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-airec"
version = "0.0.4"
description = "Evidence-driven, experimental AIREC recorder client"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Stavros Korokithakis"},
]
dependencies = ["bleak>=0.22,<0.23"]

[project.urls]
Homepage = "https://github.com/skorokithakis/open-airec"
Repository = "https://github.com/skorokithakis/open-airec"
Issues = "https://github.com/skorokithakis/open-airec/issues"

[project.scripts]
airec = "airec.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
